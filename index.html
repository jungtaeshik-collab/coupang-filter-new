<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쿠팡 단종 필터</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#F4F4F6;color:#111}
.header{background:#fff;border-bottom:1px solid #E8E8EA;padding:16px 24px;display:flex;align-items:center;justify-content:space-between}
.header-title{font-size:17px;font-weight:700;letter-spacing:-.3px}
.header-sub{font-size:11px;color:#999;margin-top:2px}
.badge-red{background:#FFF0F0;border:1px solid #FFCDD2;border-radius:20px;padding:4px 12px;font-size:12px;color:#C62828;font-weight:600}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 48px}
.card{background:#fff;border-radius:14px;border:1px solid #E8E8EA;padding:18px 20px;margin-bottom:14px}
.card-title{font-size:13px;font-weight:600;color:#333;margin-bottom:10px}
.dropzone{border:2px dashed #D8D8DC;border-radius:10px;padding:24px 20px;text-align:center;cursor:pointer;background:#FAFAFA;transition:all .15s}
.dropzone:hover,.dropzone.drag{border-color:#4F8EF7;background:#F0F5FF}
.dropzone-icon{font-size:28px;color:#CCC;margin-bottom:6px}
.dropzone-text{font-size:13px;color:#777}
.dropzone-text .filename{color:#4F8EF7;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat-card{background:#F7F7F8;border-radius:10px;padding:12px 14px}
.stat-label{font-size:11px;color:#888;margin-bottom:3px}
.stat-val{font-size:26px;font-weight:700;letter-spacing:-1px}
.action-row{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid #F0F0F2;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;font-size:13px;font-weight:600;border:none;border-radius:8px;cursor:pointer;transition:opacity .12s;white-space:nowrap}
.btn:hover{opacity:.85}
.btn-default{background:#F3F3F5;color:#333}
.btn-primary{background:#111;color:#fff}
.btn-blue{background:#EEF2FF;color:#1A44C4;border:1px solid #C5D3F7}
.btn-green{background:#EDFAF1;color:#1B6535;border:1px solid #A8DFBA}
.btn-red{background:#FFF0F0;color:#B71C1C;border:1px solid #FFCDD2}
.btn-sm{padding:5px 11px;font-size:12px}
.tabs{display:flex;border-bottom:1px solid #EBEBED;margin-bottom:12px}
.tab{background:none;border:none;padding:8px 16px;font-size:13px;cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px;font-family:inherit}
.tab.active-disc{color:#C62828;font-weight:700;border-bottom-color:#C62828}
.tab.active-ok{color:#2E7D32;font-weight:700;border-bottom-color:#2E7D32}
.tab.active-ps{color:#6A1B9A;font-weight:700;border-bottom-color:#6A1B9A}
.tab.active-pl{color:#AD1457;font-weight:700;border-bottom-color:#AD1457}
.tab.active-po{color:#888;font-weight:700;border-bottom-color:#888}
.tab.active-floem{color:#1565C0;font-weight:700;border-bottom-color:#1565C0}
.tab.active-petit{color:#6A1B9A;font-weight:700;border-bottom-color:#6A1B9A}
.tab.active-label{color:#AD1457;font-weight:700;border-bottom-color:#AD1457}
.tab.active-other{color:#888;font-weight:700;border-bottom-color:#888}
.tab:not(.active-disc):not(.active-ok){color:#999}
.tab-actions{margin-left:auto;display:flex;gap:6px;align-items:center}
.table-wrap{overflow-x:auto;max-height:420px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead tr{background:#F7F7F8;position:sticky;top:0;z-index:1}
th{padding:8px 10px;text-align:left;font-weight:600;color:#555;white-space:nowrap;border-bottom:1px solid #EBEBED}
td{padding:7px 10px;color:#333;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid #F3F3F5}
tr:nth-child(even) td{background:#FAFAFA}
.badge-disc{background:#FFEBEE;color:#B71C1C;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px}
.empty{text-align:center;padding:32px 0;font-size:14px}
.add-form{display:flex;gap:8px;flex-wrap:wrap}
.add-form input{flex:1 1 130px;padding:8px 11px;border:1px solid #D8D8DC;border-radius:8px;font-size:13px;outline:none;background:#FAFAFA;font-family:inherit}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{display:inline-flex;align-items:center;gap:5px;background:#F3F3F5;border:1px solid #E0E0E3;border-radius:20px;padding:4px 10px;font-size:12px;color:#444}
.tag-code{font-family:monospace;font-weight:600}
.tag-del{background:none;border:none;cursor:pointer;color:#BBB;padding:0;font-size:14px;line-height:1}
.disc-count{margin-top:10px;font-size:11px;color:#BABABE}
.copied{background:#EDFAF1!important;color:#1B6535!important;border-color:#A8DFBA!important}
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">쿠팡 단종 필터</div>
    <div class="header-sub">발주 파일(SKU ID 기준)에서 단종 품목을 자동으로 걸러냅니다</div>
  </div>
  <div class="badge-red" id="total-badge">단종 목록 427개</div>
</div>

<div class="wrap">

  <!-- 업로드 -->
  <div class="card">
    <div class="card-title">발주 파일 업로드</div>
    <label for="file-input" style="display:block;cursor:pointer">
      <div class="dropzone" id="dropzone">
        <div class="dropzone-icon">📂</div>
        <div class="dropzone-text" id="drop-text">PO_SKU_LIST_*.csv 또는 엑셀 파일을 여기에 끌어다 놓거나 클릭</div>
      </div>
    </label>
    <input type="file" id="file-input" accept=".xlsx,.xls,.csv" style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;z-index:-1">
  </div>

  <!-- 결과 -->
  <div class="card" id="result-card" style="display:none">
    <div class="stats" style="grid-template-columns:repeat(3,1fr)">
      <div class="stat-card"><div class="stat-label">전체 품목</div><div class="stat-val" id="s-total">0</div></div>
      <div class="stat-card"><div class="stat-label" style="color:#C62828">단종</div><div class="stat-val" style="color:#C62828" id="s-disc">0</div></div>
      <div class="stat-card"><div class="stat-label" style="color:#1565C0">플로엠</div><div class="stat-val" style="color:#1565C0" id="s-floem">0</div></div>
      <div class="stat-card"><div class="stat-label" style="color:#6A1B9A">쁘띠스티커</div><div class="stat-val" style="color:#6A1B9A" id="s-petit-sticker">0</div></div>
      <div class="stat-card"><div class="stat-label" style="color:#AD1457">쁘띠견출지</div><div class="stat-val" style="color:#AD1457" id="s-petit-label">0</div></div>
      <div class="stat-card"><div class="stat-label" style="color:#888">쁘띠기타</div><div class="stat-val" style="color:#888" id="s-petit-other">0</div></div>
    </div>

    <!-- 전체 액션 -->
    <div class="action-row">
      <button class="btn btn-blue" onclick="exportAll()">⬇ 전체 엑셀 다운 (시트 3개)</button>
      <button class="btn btn-default" id="copy-disc-btn" onclick="copyData('disc')">📋 단종 복사</button>
      <button class="btn btn-default" id="copy-floem-btn" onclick="copyData('floem')">📋 플로엠 복사</button>
      <button class="btn btn-default" id="copy-petit-sticker-btn" onclick="copyData('petit-sticker')">📋 쁘띠스티커 복사</button>
      <button class="btn btn-default" id="copy-petit-label-btn" onclick="copyData('petit-label')">📋 쁘띠견출지 복사</button>
    </div>

    <!-- 탭 -->
    <div class="tabs">
      <button class="tab active-disc" id="tab-disc" onclick="switchTab('disc')">단종 <span id="tab-disc-count">0</span>개</button>
      <button class="tab" id="tab-floem" onclick="switchTab('floem')">플로엠 <span id="tab-floem-count">0</span>개</button>
      <button class="tab" id="tab-petit-sticker" onclick="switchTab('petit-sticker')">쁘띠스티커 <span id="tab-petit-sticker-count">0</span>개</button>
      <button class="tab" id="tab-petit-label" onclick="switchTab('petit-label')">쁘띠견출지 <span id="tab-petit-label-count">0</span>개</button>
      <button class="tab" id="tab-petit-other" onclick="switchTab('petit-other')">쁘띠기타 <span id="tab-petit-other-count">0</span>개</button>
      <div class="tab-actions">
        <button class="btn btn-blue btn-sm" onclick="exportCurrent()">⬇ 엑셀</button>
        <button class="btn btn-default btn-sm" id="copy-cur-btn" onclick="copyData('current')">📋 복사</button>
      </div>
    </div>

    <div class="table-wrap">
      <table id="result-table"><thead id="result-thead"></thead><tbody id="result-tbody"></tbody></table>
      <div class="empty" id="result-empty" style="display:none"></div>
    </div>
  </div>

  <!-- 단종 코드 추가 -->
  <div class="card">
    <div class="card-title">단종 코드 추가 등록</div>
    <div class="add-form">
      <input type="text" id="add-code" placeholder="SKU ID (품목코드)" maxlength="20" onkeydown="if(event.key==='Enter') document.getElementById('add-name').focus()">
      <input type="text" id="add-name" placeholder="제품명 (선택)" onkeydown="if(event.key==='Enter') addCode()">
      <button class="btn btn-primary" onclick="addCode()">+ 추가</button>
    </div>
    <div class="tags" id="tag-list"></div>
    <div class="disc-count" id="disc-count-text">기본 427개 + 추가 0개 = 총 427개 단종 코드</div>
  </div>

</div>

function formatDateVal(val) {
  if (val === '' || val === null || val === undefined) return '';
  const s = String(val).trim();

  // 엑셀 날짜 시리얼 숫자 (정수 또는 소수점 포함: 46198, 46198.375 등)
  if (/^\d{5}(\.\d+)?$/.test(s)) {
    const serial = parseFloat(s);
    const excelEpoch = new Date(Date.UTC(1899, 11, 30));
    const d = new Date(excelEpoch.getTime() + serial * 86400000);
    const yyyy = d.getUTCFullYear();
    const mm   = String(d.getUTCMonth()+1).padStart(2,'0');
    const dd   = String(d.getUTCDate()).padStart(2,'0');
    return `${yyyy}${mm}${dd}`;
  }

  // 2026-06-17 또는 2026-06-17 08:53:48 형식 → 20260617
  const dtMatch = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (dtMatch) {
    return `${dtMatch[1]}${dtMatch[2]}${dtMatch[3]}`;
  }

  return s;
}

// 쁘띠팬시 세부 분류: 'sticker' | 'label' | 'other'
function getPetitCategory(row, headers) {
  // SKU 이름에서 패턴 찾기
  const skuName = String(row['SKU 이름'] || '').trim();
  // 스티커: DA, PD, TS 로 시작하는 코드가 SKU 이름에 포함
  if (/\b(DA|PD|TS)\d/i.test(skuName)) return 'sticker';
  // 견출지: 20-, OPM, DT 로 시작하는 코드가 SKU 이름에 포함
  if (/\b20-/i.test(skuName) || /\bOPM\d/i.test(skuName) || /\bDT\d/i.test(skuName)) return 'label';
  return 'other';
}

// 쁘띠팬시 세부 분류: 'sticker' | 'label' | 'other'
function getPetitCategory(row) {
  const name = String(row['SKU 이름'] || '').trim();

  // ── 최우선: 스탬프류 → 무조건 기타 ──────────────────────────────
  if (['스탬프','스템프','만년스탬프','만년스템프'].some(k => name.includes(k))) return 'other';

  // ── 스티커 판별 ──────────────────────────────────────────────────
  if (/DA[-_\d]/i.test(name)) return 'sticker';
  if (/PD[-_\d]/i.test(name)) return 'sticker';
  if (/TS[-_\d]/i.test(name)) return 'sticker';

  // ── 견출지 판별 ──────────────────────────────────────────────────
  if (/OPM/i.test(name)) return 'label';
  if (/20[-_]/i.test(name)) return 'label';
  if (/DT\d/i.test(name)) return 'label';
  if (/HR[-_\d]/i.test(name)) return 'label';
  const labelKeywords = [
    '인덱스','오피스포인트마스킹','오피스 포인트 마스킹','보호필름','크라프트',
    '라벨','눈알','칼라분류','마스킹견출지','견출지','무지견출지','유광견출지',
    '투명봉인','링라벨','눈모양','모서리스티커','장식용스티커','모양스티커',
    '알파벳','화살표스티커','스티커명찰'
  ];
  if (labelKeywords.some(k => name.includes(k))) return 'label';

  return 'other';
}

function reorderHeaders(headers) {
  const front = COL_ORDER_FRONT.filter(h => headers.includes(h));
  const back  = headers.filter(h => !COL_ORDER_FRONT.includes(h));
  return [...front, ...back];
}

let addedList = [];
let result = null;
let currentTab = 'disc';

const baseSet = new Set(BASE_LIST.map(b => b.code));
const baseMap = Object.fromEntries(BASE_LIST.map(b => [b.code, b.name]));

function getFullSet() {
  return new Set([...baseSet, ...addedList.map(a => a.code)]);
}
function getFullMap() {
  return { ...baseMap, ...Object.fromEntries(addedList.map(a => [a.code, a.name || '추가등록'])) };
}

// ── 파일 처리 ──────────────────────────────────────────────────────────────
function processFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const wb = XLSX.read(e.target.result, { type: 'binary' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

      let headerRow = -1, codeCol = -1;
      for (let r = 0; r < Math.min(rows.length, 6); r++) {
        const si = rows[r].findIndex(h => String(h).trim() === 'SKU ID');
        if (si >= 0) { headerRow = r; codeCol = si; break; }
        const pi = rows[r].findIndex(h => String(h).includes('품목코드'));
        if (pi >= 0) { headerRow = r; codeCol = pi; break; }
      }

      const headers = headerRow >= 0 ? rows[headerRow].map(h => String(h)) : [];
      const disc = [], floem = [], petitSticker = [], petitLabel = [], petitOther = [];
      const start = headerRow >= 0 ? headerRow + 1 : 0;
      const fullSet = getFullSet();
      const fullMap = getFullMap();

      for (let r = start; r < rows.length; r++) {
        const raw = rows[r][codeCol];
        if (raw === '' || raw === undefined || raw === null) continue;
        const code = String(raw).trim().split('.')[0];
        if (!code.match(/^\d+$/)) continue;
        const rowObj = {};
        headers.forEach((h, ci) => { rowObj[h] = rows[r][ci] ?? ''; });
        if (fullSet.has(code)) {
          disc.push({ code, row: rowObj, discName: fullMap[code] || '' });
        } else if (FLOEM_CODES.has(code)) {
          floem.push({ code, row: rowObj });
        } else {
          const cat = getPetitCategory(rowObj, headers);
          if (cat === 'sticker') {
            petitSticker.push({ code, row: rowObj });
          } else if (cat === 'label') {
            petitLabel.push({ code, row: rowObj });
          } else {
            petitOther.push({ code, row: rowObj });
          }
        }
      }

      // 쁘띠팬시 전체 = sticker + label + other
      const petit = [...petitSticker, ...petitLabel, ...petitOther];
      result = { total: disc.length + floem.length + petit.length, disc, floem, petit, petitSticker, petitLabel, petitOther, headers, fileName: file.name };
      currentTab = 'disc';
      renderResult();

      const dt = document.getElementById('drop-text');
      dt.innerHTML = `<span class="filename">✓ ${file.name}</span> <span style="color:#AAA">(${result.total.toLocaleString()}행)</span>`;
    } catch(err) { alert('파일 처리 오류: ' + err.message); }
  };
  reader.readAsBinaryString(file);
}

    empty.style.color = currentTab === 'disc' ? '#2E7D32' : '#888';
    empty.textContent = emptyMsgs[currentTab] || '없습니다';
    return;
  }
  table.style.display = '';
  empty.style.display = 'none';

  const orderedCols = reorderHeaders(result.headers);
  const brandNames = { 'floem':'플로엠', 'petit-sticker':'쁘띠스티커', 'petit-label':'쁘띠견출지', 'petit-other':'쁘띠기타' };
  const prefixCol = currentTab === 'disc' ? '단종여부' : '브랜드';
  const showHeaders = [prefixCol, ...orderedCols];
  thead.innerHTML = '<tr>' + showHeaders.map(h => `<th>${h}</th>`).join('') + '</tr>';

  tbody.innerHTML = items.map((item, ri) => {
    const cells = showHeaders.map(h => {
      if (h === '단종여부') return '<td><span class="badge-disc">단종</span></td>';
      if (h === '브랜드') {
        const bMap = {
          'floem':         { label:'플로엠',    color:'#1565C0', bg:'#E3F2FD' },
          'petit-sticker': { label:'쁘띠스티커', color:'#6A1B9A', bg:'#F3E5F5' },
          'petit-label':   { label:'쁘띠견출지', color:'#AD1457', bg:'#FCE4EC' },
          'petit-other':   { label:'쁘띠기타',   color:'#555',    bg:'#F0F0F0' },
        };
        const b = bMap[currentTab] || { label:'쁘띠팬시', color:'#6A1B9A', bg:'#F3E5F5' };
        return `<td><span style="background:${b.bg};color:${b.color};font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px">${b.label}</span></td>`;
      }
      const raw = item.row[h] ?? '';
      const val = DATE_COLS.has(h) ? formatDateVal(raw) : String(raw);
      return `<td title="${val}">${val}</td>`;
    }).join('');
    return `<tr>${cells}</tr>`;
  }).join('');
}

// ── 내보내기 ───────────────────────────────────────────────────────────────
function buildSheet(type) {
  const typeMap = { disc: result.disc, floem: result.floem, 'petit-sticker': result.petitSticker, 'petit-label': result.petitLabel, 'petit-other': result.petitOther };
  const items = typeMap[type] || [];
  const brandMap = { floem:'플로엠', 'petit-sticker':'쁘띠스티커', 'petit-label':'쁘띠견출지', 'petit-other':'쁘띠기타' };
  const brandLabel = brandMap[type] || '쁘띠팬시';
  // 열 순서 재정렬
  const orderedCols = reorderHeaders(result.headers);
  const prefixCol   = type === 'disc' ? '단종여부' : '브랜드';
  const headers     = [prefixCol, ...orderedCols];
  const dataRows = items.map(item => {
    const base = orderedCols.map(h => {
      const v = item.row[h] ?? '';
      return DATE_COLS.has(h) ? formatDateVal(v) : v;
    });
    return type === 'disc' ? ['단종', ...base] : [brandLabel, ...base];
  });
  const ws = XLSX.utils.aoa_to_sheet([headers, ...dataRows]);
  ws['!cols'] = headers.map(h => ({ wch: Math.max(String(h).length + 2, 10) }));
  return ws;
}

function exportAll() {
  if (!result) return;
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, buildSheet('disc'),           '단종제품');
  XLSX.utils.book_append_sheet(wb, buildSheet('floem'),          '플로엠');
  XLSX.utils.book_append_sheet(wb, buildSheet('petit-sticker'),  '쁘띠스티커');
  XLSX.utils.book_append_sheet(wb, buildSheet('petit-label'),    '쁘띠견출지');
  if (result.petitOther.length > 0)
    XLSX.utils.book_append_sheet(wb, buildSheet('petit-other'),  '쁘띠기타');
  XLSX.writeFile(wb, '발주확인_필터결과.xlsx');
}

function exportCurrent() {
  if (!result) return;
  const labels = { disc:'단종제품', floem:'플로엠', 'petit-sticker':'쁘띠스티커', 'petit-label':'쁘띠견출지', 'petit-other':'쁘띠기타' };
  const label = labels[currentTab] || currentTab;
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, buildSheet(currentTab), label);
  XLSX.writeFile(wb, label + '.xlsx');
}

// ── 복사 ──────────────────────────────────────────────────────────────────
function buildCopyText(type) {
  if (!result) return '';
  const typeMap = { disc: result.disc, floem: result.floem, 'petit-sticker': result.petitSticker, 'petit-label': result.petitLabel, 'petit-other': result.petitOther };
  const items = typeMap[type] || [];
  const brandMap = { floem:'플로엠', 'petit-sticker':'쁘띠스티커', 'petit-label':'쁘띠견출지', 'petit-other':'쁘띠기타' };
  const brandLabel = brandMap[type] || '쁘띠팬시';
  const orderedCols = reorderHeaders(result.headers);
  const prefixCol   = type === 'disc' ? '단종여부' : '브랜드';
  const headers     = [prefixCol, ...orderedCols];
  const rows = items.map(item => {
    const base = orderedCols.map(h => {
      const v = item.row[h] ?? '';
      return DATE_COLS.has(h) ? formatDateVal(v) : v;
    });
    return (type === 'disc' ? ['단종', ...base] : [brandLabel, ...base]).join('\t');
  });
  return [headers.join('\t'), ...rows].join('\n');
}

function copyData(type) {
  const t = type === 'current' ? currentTab : type;
  const text = buildCopyText(t);
  if (!text) return;

  const btnIdMap = { disc:'copy-disc-btn', floem:'copy-floem-btn', 'petit-sticker':'copy-petit-sticker-btn', 'petit-label':'copy-petit-label-btn', 'petit-other':'copy-cur-btn' };
  const btnId = btnIdMap[type] || 'copy-cur-btn';
  const btn = document.getElementById(btnId);
  const origText = btn.textContent;

  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✅ 복사됨!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = origText; btn.classList.remove('copied'); }, 1800);
  }).catch(() => {
    // fallback: textarea
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent = '✅ 복사됨!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = origText; btn.classList.remove('copied'); }, 1800);
  });
}

// ── 추가 코드 ──────────────────────────────────────────────────────────────
function addCode() {
  const code = document.getElementById('add-code').value.trim();
  const name = document.getElementById('add-name').value.trim();
  if (!code) return;
  if (baseSet.has(code) || addedList.find(a => a.code === code)) {
    alert('이미 등록된 코드: ' + code); return;
  }
  addedList.push({ code, name });
  document.getElementById('add-code').value = '';
  document.getElementById('add-name').value = '';
  renderTags();
}

function removeAdded(code) {
  addedList = addedList.filter(a => a.code !== code);
  renderTags();
}

function renderTags() {
  const el = document.getElementById('tag-list');
  el.innerHTML = addedList.map(a => `
    <span class="tag">
      <span class="tag-code">${a.code}</span>
      ${a.name ? `<span style="color:#888">${a.name}</span>` : ''}
      <button class="tag-del" onclick="removeAdded('${a.code}')">×</button>
    </span>`).join('');
  const total = BASE_LIST.length + addedList.length;
  document.getElementById('disc-count-text').textContent =
    `기본 ${BASE_LIST.length}개 + 추가 ${addedList.length}개 = 총 ${total}개 단종 코드`;
  document.getElementById('total-badge').textContent = `단종 목록 ${total}개`;
}

// ── 드래그 앤 드롭 / 파일 선택 ────────────────────────────────────────────
const dz = document.getElementById('dropzone');
const fi = document.getElementById('file-input');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('drag'); processFile(e.dataTransfer.files[0]); });
fi.addEventListener('change', e => processFile(e.target.files[0]));
</script>
